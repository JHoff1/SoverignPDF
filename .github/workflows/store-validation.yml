name: Validate Microsoft Store packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-store-msix:
    name: Build Store MSIX (${{ matrix.architecture }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        architecture:
          - x64
          - arm64

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Windows ARM64 Rust target
        if: matrix.architecture == 'arm64'
        run: rustup target add aarch64-pc-windows-msvc

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: store-validation-${{ matrix.architecture }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate Store artwork
        shell: pwsh
        run: ./scripts/validate-store-assets.ps1

      - name: Build Store package
        shell: pwsh
        run: ./scripts/build-msix.ps1 -Architecture "${{ matrix.architecture }}"

      - name: Retain Store package
        uses: actions/upload-artifact@v4
        with:
          name: veritypdf-store-${{ matrix.architecture }}
          path: |
            src-tauri/target/store/${{ matrix.architecture }}/*.msix
            src-tauri/target/store/${{ matrix.architecture }}/*.sha256
          if-no-files-found: error
          retention-days: 30

  build-store-upload:
    name: Validate multi-architecture Store upload
    needs: build-store-msix
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Download Store packages
        uses: actions/download-artifact@v4
        with:
          pattern: veritypdf-store-*
          path: store-packages
          merge-multiple: true

      - name: Create and validate Store upload
        shell: pwsh
        run: |
          ./scripts/build-store-upload.ps1 `
            -PackagesPath "store-packages" `
            -OutputPath (Join-Path $env:RUNNER_TEMP "VerityPDF.msixupload")

      - name: Retain validated Store upload
        uses: actions/upload-artifact@v4
        with:
          name: veritypdf-store-upload
          path: ${{ runner.temp }}/VerityPDF.msixupload
          if-no-files-found: error
          retention-days: 30

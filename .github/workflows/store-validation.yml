name: Validate Microsoft Store packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-store-msix:
    name: Build Store MSIX (${{ matrix.architecture }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        architecture:
          - x64
          - arm64

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Windows ARM64 Rust target
        if: matrix.architecture == 'arm64'
        run: rustup target add aarch64-pc-windows-msvc

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: store-validation-${{ matrix.architecture }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate Store artwork
        shell: pwsh
        run: ./scripts/validate-store-assets.ps1

      - name: Build Store package
        shell: pwsh
        run: ./scripts/build-msix.ps1 -Architecture "${{ matrix.architecture }}"

      - name: Retain Store package
        uses: actions/upload-artifact@v4
        with:
          name: sovereignpdf-store-${{ matrix.architecture }}
          path: |
            src-tauri/target/store/${{ matrix.architecture }}/*.msix
            src-tauri/target/store/${{ matrix.architecture }}/*.sha256
          if-no-files-found: error
          retention-days: 30

name: Pre-release checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend and browser regression
    runs-on: ubuntu-22.04

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run unit tests
        run: npm run test:unit

      - name: Build frontend
        run: npm run build

      - name: Run browser regression
        run: npm run test:e2e

      - name: Retain browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: veritypdf-browser-test-results
          path: test-results
          if-no-files-found: ignore
          retention-days: 14

  supply-chain:
    name: Dependency and license policy
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Audit Rust vulnerabilities
        run: cargo audit --file src-tauri/Cargo.lock

      - name: Enforce Rust dependency policy
        run: cargo deny --manifest-path src-tauri/Cargo.toml check licenses bans sources

  native:
    name: Native check (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            platform: windows-latest
            os-family: windows
          - name: macOS Apple Silicon
            platform: macos-15
            os-family: macos
          - name: macOS Intel
            platform: macos-15-intel
            os-family: macos
          - name: Linux Ubuntu 22.04
            platform: ubuntu-22.04
            os-family: linux
          - name: Linux Ubuntu 24.04
            platform: ubuntu-24.04
            os-family: linux

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Linux system dependencies
        if: matrix.os-family == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Lint and check native backend
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked -- -D warnings

      - name: Run native regression tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  linux-packages:
    name: Linux package smoke tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 22.04
            platform: ubuntu-22.04
            fuse-package: libfuse2
            artifact-suffix: ubuntu-22-04
          - name: Ubuntu 24.04
            platform: ubuntu-24.04
            fuse-package: libfuse2t64
            artifact-suffix: ubuntu-24-04

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            ${{ matrix.fuse-package }} \
            squashfs-tools \
            xvfb \
            xdotool \
            imagemagick \
            desktop-file-utils

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Linux packages
        run: npm run tauri -- build --bundles deb,appimage

      - name: Create smoke-test PDF
        run: node scripts/create-store-demo-pdf.mjs "$RUNNER_TEMP/VerityPDF Smoke Test.pdf"

      - name: Repair and verify AppImage entry-point permissions
        shell: bash
        run: |
          appimage_path="$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$appimage_path"
          bash scripts/repack-appimage.sh "$appimage_path"

      - name: Install and validate DEB
        shell: bash
        run: |
          mkdir -p smoke-artifacts
          deb_path="$(find src-tauri/target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$deb_path"
          sudo apt-get install -y "$PWD/$deb_path"

          package_name="$(dpkg-deb -f "$deb_path" Package)"
          installed_binary="$(dpkg -L "$package_name" | grep -E '^/usr/bin/' | head -n 1)"
          desktop_entry="$(dpkg -L "$package_name" | grep -E '^/usr/share/applications/.*\.desktop$' | head -n 1)"

          test -x "$installed_binary"
          test -f "$desktop_entry"
          desktop-file-validate "$desktop_entry"
          grep -Eq '^MimeType=.*application/pdf' "$desktop_entry"
          xdg-mime query filetype "$RUNNER_TEMP/VerityPDF Smoke Test.pdf" | grep -Fx 'application/pdf'
          cp "$desktop_entry" smoke-artifacts/deb-desktop-entry.desktop
          ldd "$installed_binary" | tee smoke-artifacts/deb-ldd.txt
          if grep -q 'not found' smoke-artifacts/deb-ldd.txt; then
            echo "The installed DEB has unresolved shared-library dependencies." >&2
            exit 1
          fi

          bash scripts/smoke-linux-window.sh \
            deb \
            "$installed_binary" \
            "$RUNNER_TEMP/VerityPDF Smoke Test.pdf" \
            smoke-artifacts \
            "$desktop_entry"

      - name: Validate AppImage behavior
        shell: bash
        run: |
          appimage_path="$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$appimage_path"
          bash scripts/smoke-linux-window.sh \
            appimage \
            "$appimage_path" \
            "$RUNNER_TEMP/VerityPDF Smoke Test.pdf" \
            smoke-artifacts

      - name: Retain Linux smoke-test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: veritypdf-linux-${{ matrix.artifact-suffix }}-smoke-diagnostics
          path: smoke-artifacts
          if-no-files-found: warn
          retention-days: 14

  macos-package:
    name: macOS universal DMG smoke test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon
            platform: macos-15
            expected-architecture: arm64
            artifact-suffix: apple-silicon
          - name: Intel
            platform: macos-15-intel
            expected-architecture: x86_64
            artifact-suffix: intel

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify native runner architecture
        shell: bash
        run: |
          actual_architecture="$(uname -m)"
          test "$actual_architecture" = "${{ matrix.expected-architecture }}"
          echo "Testing the native $actual_architecture macOS application slice."

      - name: Build universal DMG
        run: npm run tauri -- build --bundles dmg --target universal-apple-darwin

      - name: Create smoke-test PDF
        run: node scripts/create-store-demo-pdf.mjs "$RUNNER_TEMP/VerityPDF Smoke Test.pdf"

      - name: Mount and validate universal DMG
        shell: bash
        run: |
          dmg_path="$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$dmg_path"
          bash scripts/smoke-macos-dmg.sh \
            "$dmg_path" \
            "$RUNNER_TEMP/VerityPDF Smoke Test.pdf" \
            smoke-artifacts

      - name: Retain macOS smoke-test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: veritypdf-macos-${{ matrix.artifact-suffix }}-smoke-diagnostics
          path: smoke-artifacts
          if-no-files-found: warn
          retention-days: 14

  windows-arm64-msix:
    name: Native Windows ARM64 Store runtime
    runs-on: windows-11-arm
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Verify native ARM64 runner
        shell: pwsh
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -ne "ARM64") {
            throw "Expected a native ARM64 runner, found $env:PROCESSOR_ARCHITECTURE."
          }

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: native-windows-arm64-store

      - name: Install frontend dependencies
        run: npm ci

      - name: Build ARM64 Store package natively
        shell: pwsh
        run: ./scripts/build-msix.ps1 -Architecture arm64

      - name: Create smoke-test PDF
        run: node scripts/create-store-demo-pdf.mjs "$env:RUNNER_TEMP\VerityPDF ARM64 Smoke Test.pdf"

      - name: Install and launch ARM64 MSIX
        timeout-minutes: 5
        shell: pwsh
        run: |
          $package = Get-ChildItem "src-tauri/target/store/arm64/*.msix" |
            Select-Object -First 1
          if (-not $package) { throw "The ARM64 Store package is missing." }
          ./scripts/smoke-windows-msix.ps1 `
            -Package $package.FullName `
            -Pdf "$env:RUNNER_TEMP\VerityPDF ARM64 Smoke Test.pdf" `
            -ArtifactDirectory "smoke-artifacts"

      - name: Retain ARM64 diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: veritypdf-windows-arm64-smoke-diagnostics
          path: smoke-artifacts
          if-no-files-found: warn
          retention-days: 14

  windows-installers:
    name: Clean Windows installer and upgrade regression
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: windows-installers

      - name: Install frontend dependencies
        run: npm ci

      - name: Build MSI and NSIS installers
        run: npm run tauri -- build --bundles msi,nsis

      - name: Download previous release installers
        id: previous
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $currentTag = "v$((Get-Content package.json -Raw | ConvertFrom-Json).version)"
          $release = gh release list --repo $env:GITHUB_REPOSITORY `
            --limit 25 --json tagName,isDraft,isPrerelease,publishedAt |
            ConvertFrom-Json |
            Where-Object { -not $_.isDraft -and -not $_.isPrerelease -and $_.tagName -ne $currentTag } |
            Sort-Object publishedAt -Descending |
            Select-Object -First 1
          if (-not $release) {
            "available=false" | Out-File $env:GITHUB_OUTPUT -Append
            exit 0
          }
          New-Item -ItemType Directory previous-installers | Out-Null
          gh release download $release.tagName --repo $env:GITHUB_REPOSITORY `
            --dir previous-installers --pattern "VerityPDF.msi" --pattern "VerityPDF.exe"
          "available=true" | Out-File $env:GITHUB_OUTPUT -Append

      - name: Create smoke-test PDF
        run: node scripts/create-store-demo-pdf.mjs "$env:RUNNER_TEMP\VerityPDF Installer Smoke Test.pdf"

      - name: Install, upgrade, open PDF, and uninstall
        timeout-minutes: 10
        shell: pwsh
        run: |
          $msi = Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi" |
            Select-Object -First 1
          $nsis = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" |
            Select-Object -First 1
          if (-not $msi -or -not $nsis) { throw "Candidate installers are missing." }
          $arguments = @{
            Msi = $msi.FullName
            Nsis = $nsis.FullName
            Pdf = "$env:RUNNER_TEMP\VerityPDF Installer Smoke Test.pdf"
            ArtifactDirectory = "smoke-artifacts"
          }
          if (Test-Path "previous-installers/VerityPDF.msi") {
            $arguments.PreviousMsi = (Resolve-Path "previous-installers/VerityPDF.msi").Path
          }
          if (Test-Path "previous-installers/VerityPDF.exe") {
            $arguments.PreviousNsis = (Resolve-Path "previous-installers/VerityPDF.exe").Path
          }
          ./scripts/smoke-windows-installers.ps1 @arguments

      - name: Retain Windows installer diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: veritypdf-windows-installer-smoke-diagnostics
          path: smoke-artifacts
          if-no-files-found: warn
          retention-days: 14

name: Build desktop release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare draft release
    runs-on: ubuntu-latest
    steps:
      - name: Create or find draft release
        uses: actions/github-script@v9
        with:
          retries: 3
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = context.ref.replace("refs/tags/", "");

            const releases = await github.paginate(
              github.rest.repos.listReleases,
              { owner, repo, per_page: 100 },
            );
            const existing = releases.find(
              (release) => release.tag_name === tag,
            );

            if (existing) {
              core.info(`Using existing release ${existing.id} for ${tag}.`);
            } else {
              const created = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                name: `VerityPDF ${tag}`,
                body:
                  "Download the installer for your operating system from the " +
                  "assets below.\n\nVerityPDF processes documents entirely " +
                  "on your device.",
                draft: true,
                prerelease: false,
              });
              core.info(`Created draft release ${created.data.id} for ${tag}.`);
            }

  build:
    name: Build ${{ matrix.name }}
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            platform: windows-latest
            args: --bundles nsis,msi
          - name: macOS
            platform: macos-latest
            args: --bundles dmg --target universal-apple-darwin
          - name: Linux
            platform: ubuntu-22.04
            args: --bundles deb,appimage

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            squashfs-tools

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install universal macOS Rust targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and attach installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: VerityPDF ${{ github.ref_name }}
          releaseBody: |
            Download the installer for your operating system from the assets below.

            VerityPDF processes documents entirely on your device.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Repair and verify AppImage entry-point permissions
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          appimage_path="$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$appimage_path"
          bash scripts/repack-appimage.sh "$appimage_path"

      - name: Replace draft AppImage with repaired package
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          appimage_path="$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$appimage_path"
          gh release upload "$RELEASE_TAG" "$appimage_path" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  store-msix:
    name: Build Microsoft Store MSIX (${{ matrix.architecture }})
    needs: prepare-release
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        architecture:
          - x64
          - arm64
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Windows ARM64 Rust target
        if: matrix.architecture == 'arm64'
        run: rustup target add aarch64-pc-windows-msvc

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: store-${{ matrix.architecture }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate Store artwork
        shell: pwsh
        run: ./scripts/validate-store-assets.ps1

      - name: Build Store package
        shell: pwsh
        run: ./scripts/build-msix.ps1 -Architecture "${{ matrix.architecture }}"

      - name: Retain Store package
        uses: actions/upload-artifact@v4
        with:
          name: veritypdf-store-${{ matrix.architecture }}
          path: |
            src-tauri/target/store/${{ matrix.architecture }}/*.msix
            src-tauri/target/store/${{ matrix.architecture }}/*.sha256
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish verified release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download installer assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets

      - name: Generate SHA-256 checksums
        run: |
          cd release-assets
          cp "$(find . -maxdepth 1 -type f -name '*.AppImage' -print -quit)" VerityPDF.AppImage
          cp "$(find . -maxdepth 1 -type f -name '*.deb' -print -quit)" VerityPDF.deb
          cp "$(find . -maxdepth 1 -type f -name '*.dmg' -print -quit)" VerityPDF.dmg
          cp "$(find . -maxdepth 1 -type f -name '*-setup.exe' -print -quit)" VerityPDF.exe
          cp "$(find . -maxdepth 1 -type f -name '*.msi' -print -quit)" VerityPDF.msi
          sha256sum \
            VerityPDF.AppImage \
            VerityPDF.deb \
            VerityPDF.dmg \
            VerityPDF.exe \
            VerityPDF.msi \
            > SHA256SUMS.txt

      - name: Attach stable download files and checksum manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            release-assets/VerityPDF.AppImage \
            release-assets/VerityPDF.deb \
            release-assets/VerityPDF.dmg \
            release-assets/VerityPDF.exe \
            release-assets/VerityPDF.msi \
            release-assets/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Remove versioned duplicate assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name' |
          while IFS= read -r asset; do
            case "$asset" in
              VerityPDF.AppImage|VerityPDF.deb|VerityPDF.dmg|VerityPDF.exe|VerityPDF.msi|SHA256SUMS.txt)
                ;;
              *)
                gh release delete-asset "$RELEASE_TAG" "$asset" \
                  --repo "$GITHUB_REPOSITORY" --yes
                ;;
            esac
          done

      - name: Verify assets and publish
        uses: actions/github-script@v9
        with:
          retries: 3
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = context.ref.replace("refs/tags/", "");
            const releases = await github.paginate(
              github.rest.repos.listReleases,
              { owner, repo, per_page: 100 },
            );
            const release = releases.find(
              (candidate) => candidate.tag_name === tag,
            );

            if (!release) {
              core.setFailed(`No GitHub release exists for ${tag}.`);
              return;
            }

            const expectedAssets = [
              "VerityPDF.AppImage",
              "VerityPDF.deb",
              "VerityPDF.dmg",
              "VerityPDF.exe",
              "VerityPDF.msi",
              "SHA256SUMS.txt",
            ];
            const missingAssets = expectedAssets.filter(
              (expectedName) => !release.assets.some(
                (asset) => asset.name === expectedName,
              ),
            );
            if (missingAssets.length > 0) {
              core.setFailed(
                `Release ${tag} is missing: ${missingAssets.join(", ")}.`,
              );
              return;
            }

            await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: release.id,
              draft: false,
              prerelease: false,
              make_latest: "true",
            });
            core.info(`Published ${tag} with ${release.assets.length} assets.`);

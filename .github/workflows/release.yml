name: Build desktop release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare draft release
    runs-on: ubuntu-latest
    steps:
      - name: Create or find draft release
        uses: actions/github-script@v9
        with:
          retries: 3
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = context.ref.replace("refs/tags/", "");

            const releases = await github.paginate(
              github.rest.repos.listReleases,
              { owner, repo, per_page: 100 },
            );
            const existing = releases.find(
              (release) => release.tag_name === tag,
            );

            if (existing) {
              core.info(`Using existing release ${existing.id} for ${tag}.`);
            } else {
              const created = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                name: `VerityPDF ${tag}`,
                body:
                  "Download the installer for your operating system from the " +
                  "assets below.\n\nVerityPDF processes documents entirely " +
                  "on your device.",
                draft: true,
                prerelease: false,
              });
              core.info(`Created draft release ${created.data.id} for ${tag}.`);
            }

  build:
    name: Build ${{ matrix.name }}
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            platform: windows-latest
            args: --bundles nsis,msi
          - name: macOS
            platform: macos-latest
            args: --bundles dmg --target universal-apple-darwin
          - name: Linux
            platform: ubuntu-22.04
            args: --bundles deb,appimage

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            squashfs-tools \
            xvfb \
            xdotool \
            imagemagick \
            desktop-file-utils

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install universal macOS Rust targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and attach installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: VerityPDF ${{ github.ref_name }}
          releaseBody: |
            Download the installer for your operating system from the assets below.

            VerityPDF processes documents entirely on your device.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Create package smoke-test PDF
        if: matrix.platform != 'windows-latest'
        run: node scripts/create-store-demo-pdf.mjs "$RUNNER_TEMP/VerityPDF Smoke Test.pdf"

      - name: Repair and verify AppImage entry-point permissions
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          appimage_path="$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$appimage_path"
          bash scripts/repack-appimage.sh "$appimage_path"

      - name: Install and validate Linux packages
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          mkdir -p smoke-artifacts
          deb_path="$(find src-tauri/target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print -quit)"
          appimage_path="$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$deb_path"
          test -n "$appimage_path"
          sudo apt-get install -y "$PWD/$deb_path"

          package_name="$(dpkg-deb -f "$deb_path" Package)"
          installed_binary="$(dpkg -L "$package_name" | grep -E '^/usr/bin/' | head -n 1)"
          desktop_entry="$(dpkg -L "$package_name" | grep -E '^/usr/share/applications/.*\.desktop$' | head -n 1)"

          test -x "$installed_binary"
          test -f "$desktop_entry"
          desktop-file-validate "$desktop_entry"
          grep -Eq '^MimeType=.*application/pdf' "$desktop_entry"
          xdg-mime query filetype "$RUNNER_TEMP/VerityPDF Smoke Test.pdf" | grep -Fx 'application/pdf'
          cp "$desktop_entry" smoke-artifacts/deb-desktop-entry.desktop
          ldd "$installed_binary" | tee smoke-artifacts/deb-ldd.txt
          if grep -q 'not found' smoke-artifacts/deb-ldd.txt; then
            echo "The installed DEB has unresolved shared-library dependencies." >&2
            exit 1
          fi

          bash scripts/smoke-linux-window.sh \
            deb \
            "$installed_binary" \
            "$RUNNER_TEMP/VerityPDF Smoke Test.pdf" \
            smoke-artifacts \
            "$desktop_entry"
          bash scripts/smoke-linux-window.sh \
            appimage \
            "$appimage_path" \
            "$RUNNER_TEMP/VerityPDF Smoke Test.pdf" \
            smoke-artifacts

      - name: Mount and validate universal macOS DMG
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          dmg_path="$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$dmg_path"
          bash scripts/smoke-macos-dmg.sh \
            "$dmg_path" \
            "$RUNNER_TEMP/VerityPDF Smoke Test.pdf" \
            smoke-artifacts

      - name: Retain package smoke-test diagnostics
        if: failure() && matrix.platform != 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: veritypdf-${{ matrix.name }}-smoke-diagnostics
          path: smoke-artifacts
          if-no-files-found: warn
          retention-days: 14

      - name: Replace draft AppImage with repaired package
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          appimage_path="$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$appimage_path"
          gh release upload "$RELEASE_TAG" "$appimage_path" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  store-msix:
    name: Build Microsoft Store MSIX (${{ matrix.architecture }})
    needs: prepare-release
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        architecture:
          - x64
          - arm64
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Windows ARM64 Rust target
        if: matrix.architecture == 'arm64'
        run: rustup target add aarch64-pc-windows-msvc

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: store-${{ matrix.architecture }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate Store artwork
        shell: pwsh
        run: ./scripts/validate-store-assets.ps1

      - name: Build Store package
        shell: pwsh
        run: ./scripts/build-msix.ps1 -Architecture "${{ matrix.architecture }}"

      - name: Retain Store package
        uses: actions/upload-artifact@v4
        with:
          name: veritypdf-store-${{ matrix.architecture }}
          path: |
            src-tauri/target/store/${{ matrix.architecture }}/*.msix
            src-tauri/target/store/${{ matrix.architecture }}/*.sha256
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish verified release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download installer assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets

      - name: Generate SHA-256 checksums
        run: |
          cd release-assets
          cp "$(find . -maxdepth 1 -type f -name '*.AppImage' -print -quit)" VerityPDF.AppImage
          cp "$(find . -maxdepth 1 -type f -name '*.deb' -print -quit)" VerityPDF.deb
          cp "$(find . -maxdepth 1 -type f -name '*.dmg' -print -quit)" VerityPDF.dmg
          cp "$(find . -maxdepth 1 -type f -name '*-setup.exe' -print -quit)" VerityPDF.exe
          cp "$(find . -maxdepth 1 -type f -name '*.msi' -print -quit)" VerityPDF.msi
          sha256sum \
            VerityPDF.AppImage \
            VerityPDF.deb \
            VerityPDF.dmg \
            VerityPDF.exe \
            VerityPDF.msi \
            > SHA256SUMS.txt

      - name: Attach stable download files and checksum manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            release-assets/VerityPDF.AppImage \
            release-assets/VerityPDF.deb \
            release-assets/VerityPDF.dmg \
            release-assets/VerityPDF.exe \
            release-assets/VerityPDF.msi \
            release-assets/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Remove versioned duplicate assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name' |
          while IFS= read -r asset; do
            case "$asset" in
              VerityPDF.AppImage|VerityPDF.deb|VerityPDF.dmg|VerityPDF.exe|VerityPDF.msi|SHA256SUMS.txt)
                ;;
              *)
                gh release delete-asset "$RELEASE_TAG" "$asset" \
                  --repo "$GITHUB_REPOSITORY" --yes
                ;;
            esac
          done

      - name: Verify assets and publish
        uses: actions/github-script@v9
        with:
          retries: 3
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = context.ref.replace("refs/tags/", "");
            const releases = await github.paginate(
              github.rest.repos.listReleases,
              { owner, repo, per_page: 100 },
            );
            const release = releases.find(
              (candidate) => candidate.tag_name === tag,
            );

            if (!release) {
              core.setFailed(`No GitHub release exists for ${tag}.`);
              return;
            }

            const expectedAssets = [
              "VerityPDF.AppImage",
              "VerityPDF.deb",
              "VerityPDF.dmg",
              "VerityPDF.exe",
              "VerityPDF.msi",
              "SHA256SUMS.txt",
            ];
            const missingAssets = expectedAssets.filter(
              (expectedName) => !release.assets.some(
                (asset) => asset.name === expectedName,
              ),
            );
            if (missingAssets.length > 0) {
              core.setFailed(
                `Release ${tag} is missing: ${missingAssets.join(", ")}.`,
              );
              return;
            }

            await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: release.id,
              draft: false,
              prerelease: false,
              make_latest: "true",
            });
            core.info(`Published ${tag} with ${release.assets.length} assets.`);

  publish-microsoft-store:
    name: Submit Microsoft Store update
    needs:
      - store-msix
      - publish-release
    runs-on: windows-latest
    environment:
      name: microsoft-store
    concurrency:
      group: microsoft-store-submission
      cancel-in-progress: false
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Download Store packages
        uses: actions/download-artifact@v4
        with:
          pattern: veritypdf-store-*
          path: store-packages
          merge-multiple: true

      - name: Create multi-architecture Store upload
        id: store-upload
        shell: pwsh
        run: |
          $uploadPath = Join-Path $env:RUNNER_TEMP "VerityPDF.msixupload"
          ./scripts/build-store-upload.ps1 `
            -PackagesPath "store-packages" `
            -OutputPath $uploadPath
          "path=$uploadPath" | Out-File -FilePath $env:GITHUB_OUTPUT `
            -Encoding utf8 -Append

      - name: Retain combined Store upload
        uses: actions/upload-artifact@v4
        with:
          name: veritypdf-store-upload
          path: ${{ steps.store-upload.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Install Microsoft Store Developer CLI
        uses: microsoft/microsoft-store-apppublisher@v1.1

      - name: Configure Microsoft Store credentials
        shell: pwsh
        run: |
          msstore reconfigure `
            --tenantId "${{ secrets.AZURE_AD_TENANT_ID }}" `
            --sellerId "${{ secrets.SELLER_ID }}" `
            --clientId "${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}" `
            --clientSecret "${{ secrets.AZURE_AD_APPLICATION_SECRET }}"

      - name: Publish Store submission
        shell: pwsh
        env:
          MS_STORE_PRODUCT_ID: ${{ vars.MS_STORE_PRODUCT_ID }}
          STORE_UPLOAD_PATH: ${{ steps.store-upload.outputs.path }}
        run: |
          if (-not $env:MS_STORE_PRODUCT_ID) {
            throw "The MS_STORE_PRODUCT_ID environment variable is not configured."
          }
          msstore publish "$env:STORE_UPLOAD_PATH" `
            -id "$env:MS_STORE_PRODUCT_ID"

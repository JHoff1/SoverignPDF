[package]
name = "verity-pdf"
version = "0.1.14"
description = "A private, local-first PDF editor"
authors = ["VerityPDF contributors"]
homepage = "https://www.veritypdf.com/"
repository = "https://github.com/JHoff1/VerityPDF"
edition = "2021"
license = "AGPL-3.0-or-later"

[lib]
name = "verity_pdf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
